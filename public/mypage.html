<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>마이페이지 · My ref archive</title>
<link rel="stylesheet" href="style.css">

<style>
  /* 로그인 화면의 카드·입력창 모양을 그대로 쓰고, 왼쪽 정렬만 바꾼다. */
  .auth-card { margin: 0 auto; text-align: left; }

  .field-label {
    margin: 0 0 4px;
    font-size: 12px;
    color: var(--gray);
  }

  .field-value {
    margin: 0 0 24px;
    font-size: 14px;
    font-weight: 600;
    word-break: break-all;
  }

  /* 카드가 여러 장 쌓이므로 사이를 띄우고, 카드 마지막 줄의 아래 여백은 없앤다. */
  .auth-card + .auth-card { margin-top: 16px; }
  .auth-card > :last-child { margin-bottom: 0; }

  .hint-text {
    margin: 0 0 14px;
    font-size: 12px;
    line-height: 1.6;
    color: var(--gray);
  }

  /* 카테고리별 개수 — 이름은 왼쪽, 개수는 오른쪽에 붙는 한 줄짜리 목록. */
  .stat-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
  }

  .stat-row:last-child { border-bottom: none; }
  .stat-row .stat-count { font-weight: 700; }

  .export-row {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  /* 내보내기는 보조 동작이라 크림색 알약으로 한 톤 낮춘다. */
  .export-row button {
    flex: 1;
    min-width: 140px;
    padding: 12px 18px;
    font-size: 13px;
    background: var(--tint);
    color: var(--black);
  }

  /* 되돌릴 수 없는 동작이므로 다른 카드와 확실히 떨어뜨리고 빨간 테두리로 구분한다. */
  #dangerCard { margin-top: 32px; }

  .danger-btn {
    width: 100%;
    padding: 12px 18px;
    font-size: 13px;
    background: var(--white);
    color: #d00;
    box-shadow: none;
    outline: 1px solid #d00;
    outline-offset: -1px;
  }

  .danger-btn:hover {
    background: #d00;
    color: var(--white);
    opacity: 1;
  }

  /* 카드와 같은 폭으로 맞춰서 입력창 바로 아래에 붙어 보이게 한다. */
  #mypageStatus {
    max-width: 380px;
    margin: 12px auto 0;
  }

  main a { color: var(--blue); }
</style>

<header class="topbar">
  <div class="account-row">
    <a class="account-link" href="/">아카이브로</a>
    <button id="logoutBtn" class="logout-btn" type="button">로그아웃</button>
  </div>
  <h1>마이페이지</h1>
</header>

<main>
  <p id="loginNotice" class="empty-msg" hidden>
    먼저 <a href="/">로그인</a> 해주세요.
  </p>

  <div id="statsCard" class="auth-card" hidden>
    <p class="field-label">저장 현황</p>
    <p id="statsSummary" class="field-value"></p>

    <p class="field-label">카테고리별</p>
    <div id="categoryStats"></div>
  </div>

  <div id="accountCard" class="auth-card" hidden>
    <p class="field-label">로그인한 계정</p>
    <p id="accountEmail" class="field-value"></p>

    <p class="field-label">비밀번호 변경</p>
    <form id="passwordForm" class="auth-form">
      <input id="currentPassword" type="password" placeholder="현재 비밀번호" autocomplete="current-password" required />
      <input id="newPassword" type="password" placeholder="새 비밀번호 (8자 이상)" autocomplete="new-password" required />
      <input id="newPasswordConfirm" type="password" placeholder="새 비밀번호 확인" autocomplete="new-password" required />
      <button id="submitBtn" type="submit">비밀번호 변경</button>
    </form>
  </div>

  <div id="exportCard" class="auth-card" hidden>
    <p class="field-label">데이터 내보내기</p>
    <p class="hint-text">저장한 레퍼런스를 파일로 내려받아 따로 보관할 수 있어요. CSV 는 엑셀이나 구글 시트에서 바로 열려요.</p>
    <div class="export-row">
      <button id="exportJsonBtn" type="button">JSON으로 내보내기</button>
      <button id="exportCsvBtn" type="button">CSV로 내보내기</button>
    </div>
  </div>

  <div id="dangerCard" class="auth-card" hidden>
    <p class="field-label">회원 탈퇴</p>
    <p class="hint-text">계정과 저장한 레퍼런스가 모두 삭제되고, 되돌릴 수 없어요. 필요한 자료는 먼저 내보내 두세요.</p>
    <button id="deleteAccountBtn" class="danger-btn" type="button">회원 탈퇴</button>
  </div>

  <p id="mypageStatus" class="status"></p>
</main>

<script src="mypage.js"></script>
